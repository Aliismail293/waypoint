[project]
name = "waypoint"
version = "0.1.0"
description = "Multi-agent degree-planning copilot for UTM students, on Google ADK and Cloud Run."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Ali Ekramy Ismail" }]
dependencies = [
    "google-adk>=2.15.0",
    "google-genai>=3.6.1",
    "mcp>=2.3",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "psycopg[binary,pool]>=3.3.9",
    "pgvector>=0.5.1",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-firestore>=2.34.1",
    "google-auth>=2.63.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "fpdf2>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]
e2e = [
    "playwright>=1.65.2",
]
eval = ["ragaudit"]

[tool.uv.sources]
# Pinned by commit (the eval gate was calibrated on it); ../Rag-Tester is now a different package, ragaudit-cli.
ragaudit = { git = "https://github.com/Aliismail293/rag-tester.git", rev = "236bf5028ebe780b2677ced6ec24c0a02b860d67" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waypoint"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["waypoint"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs real GCP / Vertex AI (skipped unless WAYPOINT_LIVE_TESTS=1)"]
