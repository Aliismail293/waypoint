[project]
name = "waypoint"
version = "0.1.0"
description = "Multi-agent degree-planning copilot for UTM students, on Google ADK and Cloud Run."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Ali Ekramy Ismail" }]
dependencies = [
    "google-adk>=2.13",
    "google-genai>=2.33",
    "mcp>=2.3",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.5",
    "google-cloud-bigquery>=3.46",
    "google-cloud-firestore>=2.34",
    "google-auth>=2.62",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-gcp-trace>=1.9",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
eval = ["ragaudit"]

[tool.uv.sources]
ragaudit = { path = "../Rag-Tester", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waypoint"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["waypoint"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs real GCP / Vertex AI (skipped unless WAYPOINT_LIVE_TESTS=1)"]
