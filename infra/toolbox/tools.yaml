kind: tool
name: search_courses
type: bigquery-sql
source: waypoint-bigquery
description: "Courses whose title or description matches a LIKE pattern, optionally in one department."
statement: |
  SELECT code, title, level, credits FROM `waypoint-513003.waypoint`.courses WHERE (LOWER(title) LIKE @pattern OR LOWER(description) LIKE @pattern) AND (@department = '' OR department = @department) ORDER BY code LIMIT 15
parameters:
  - name: pattern
    type: string
    description: "Lower-case SQL LIKE pattern, e.g. %linear algebra%."
  - name: department
    type: string
    description: "Department prefix like MAT, or empty for all."
