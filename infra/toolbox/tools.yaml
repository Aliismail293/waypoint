kind: tool
name: courses_unlocked_by
type: bigquery-sql
source: waypoint-bigquery
description: "Courses that list the given course code among their prerequisites."
statement: |
  SELECT c.code, c.title, c.prerequisites, c.chunk_id FROM `waypoint-513003.waypoint`.prerequisites p JOIN `waypoint-513003.waypoint`.courses c ON c.code = p.course_code WHERE STARTS_WITH(p.required_code, @code) ORDER BY c.code
parameters:
  - name: code
    type: string
    description: "Course or program code, upper case, e.g. MAT224 or ERMAJ2511."
