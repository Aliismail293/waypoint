kind: tool
name: get_course
type: bigquery-sql
source: waypoint-bigquery
description: "One UTM course by code prefix (e.g. MAT224 or MAT224H5): prerequisites, exclusions, credits."
statement: |
  SELECT code, title, description, credits, level, prerequisites, prerequisite_codes, corequisites, exclusions, exclusion_codes, recommended_preparation, distribution, delivery, source_url, chunk_id FROM `waypoint-513003.waypoint`.courses WHERE STARTS_WITH(code, @code) ORDER BY code LIMIT 2
parameters:
  - name: code
    type: string
    description: "Course or program code, upper case, e.g. MAT224 or ERMAJ2511."
